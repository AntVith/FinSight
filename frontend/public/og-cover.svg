<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b0e1a"/>
      <stop offset="55%" stop-color="#1a1235"/>
      <stop offset="100%" stop-color="#2a1457"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="600" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="spark" x1="80" y1="500" x2="1100" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f0abfc"/>
    </linearGradient>
    <radialGradient id="halo" cx="950" cy="180" r="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="950" cy="180" r="260" fill="url(#halo)"/>

  <g transform="translate(80, 80)">
    <rect width="64" height="64" rx="16" fill="url(#brand)"/>
    <path d="M12 46 L24 32 L32 38 L44 20 L56 26" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="56" cy="26" r="3.5" fill="#ffffff"/>
    <text x="84" y="42" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="28" font-weight="600" fill="#ffffff" letter-spacing="-0.5">FinSight</text>
  </g>

  <text x="80" y="280" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="74" font-weight="700" fill="#ffffff" letter-spacing="-2.5">Personal finance,</text>
  <text x="80" y="370" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="74" font-weight="700" fill="url(#spark)" letter-spacing="-2.5">decoded by AI.</text>

  <text x="80" y="430" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="26" font-weight="400" fill="#cbd5e1">Plaid-linked transactions. Claude-powered insights.</text>
  <text x="80" y="466" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="26" font-weight="400" fill="#cbd5e1">Live spend analytics with zero spreadsheets.</text>

  <g transform="translate(80, 520)">
    <rect x="0" y="0" width="200" height="44" rx="22" fill="url(#brand)"/>
    <text x="100" y="29" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#ffffff" text-anchor="middle">Open the demo</text>

    <rect x="220" y="0" width="220" height="44" rx="22" fill="none" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="330" y="29" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="#cbd5e1" text-anchor="middle">View on GitHub</text>
  </g>

  <g opacity="0.85">
    <polyline points="700,470 770,420 820,440 880,360 940,400 1000,300 1080,330"
              fill="none" stroke="url(#spark)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="700" cy="470" r="5" fill="#a78bfa"/>
    <circle cx="820" cy="440" r="5" fill="#a78bfa"/>
    <circle cx="940" cy="400" r="5" fill="#a78bfa"/>
    <circle cx="1080" cy="330" r="6" fill="#f0abfc"/>
  </g>
</svg>
